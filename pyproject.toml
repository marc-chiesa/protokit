[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protokit"
version = "0.9.0"
description = "Python toolkit for Protocol Buffers: structural message diffing and schema compatibility checking."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Marc Chiesa", email = "3333934+marc-chiesa@users.noreply.github.com" },
]
keywords = ["protobuf", "diff", "schema", "compatibility", "protocol-buffers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Upper bound: protobuf 6+ removed several FieldDescriptor /
    # MessageDescriptor attributes (notably ``.label``) that protokit's
    # lint rule packs and the compatibility checker rely on. Adopting
    # the new API is planned for a future release; for now we pin to
    # the same range the [compiler] extra's protoxy 0.7.x package
    # transitively pins (``protobuf<6``), so users get a working
    # install whether or not they install [compiler].
    "protobuf>=4.21.0,<6",
    "click>=8.0",
    # TOML parsing for pyproject [tool.protokit.lint] configuration.
    # Python 3.11+ ships tomllib in stdlib; tomli is the 3.10 fallback.
    # Standard import pattern: `import tomllib if sys.version_info >= (3, 11) else import tomli as tomllib`.
    "tomli>=2.0,<3; python_version<'3.11'",
    # gitignore-style glob matching for [tool.protokit.lint] exclude /
    # --exclude PATTERN. Pure-Python; used by mypy/dvc/pre-commit.
    "pathspec>=0.12,<2",
]

[project.optional-dependencies]
# In-process .proto → FileDescriptorSet compiler via Rust bindings.
# When installed, protokit's CLI prefers it over shelling out to
# protoc on PATH. Users who already have protoc installed don't need
# this extra; users who want a zero-external-dependency toolchain do.
compiler = [
    "protoxy>=0.7",
]
# Columnar output: convert scanned protobuf to Apache Arrow / Parquet.
# ptars (Rust/PyO3, prost-based) is EXACT-pinned — it is 0.0.x with no API
# stability promise, and its Rust core bundles a specific arrow-rs that must
# stay ABI-compatible with the resolved pyarrow (verified against pyarrow 24).
# ptars is decoupled from the protobuf Python API (it reads descriptors only),
# so it composes with the base ``protobuf>=4.21,<6`` pin without conflict.
# Neither package is a base dependency — the core install is unaffected when
# this extra is absent (a missing extra raises ParquetExtraNotInstalledError,
# never a raw ImportError).
parquet = [
    "ptars==0.0.17",
    "pyarrow>=16.0.0,<25",
]
# Development / test-only dependencies.
#  - xmlschema validates JUnit XML output against the vendored
#    Apache Ant JUnit xsd in tests/fixtures/junit-xml/.
#  - jsonschema validates SARIF 2.1.0 output against the vendored
#    OASIS schema in tests/fixtures/sarif/.
# Neither is needed at runtime — formatters emit XML/JSON via
# stdlib only.
dev = [
    "pytest",
    "xmlschema>=2.0",
    "jsonschema>=4.0",
    "types-jsonschema",
    "mypy>=1.8",
    "ruff>=0.5",
    # The perf-smoke meta-test parses .github/workflows/ci.yml via
    # yaml.safe_load to assert at-least-one-cell-ran. NEVER
    # yaml.load() without explicit SafeLoader (security: prevents
    # arbitrary code execution via YAML object construction).
    "PyYAML>=6.0,<7",
    "types-PyYAML",
]

[project.scripts]
protokit = "protokit.cli:main"

[project.urls]
Homepage = "https://github.com/marc-chiesa/protokit"
Repository = "https://github.com/marc-chiesa/protokit"
Changelog = "https://github.com/marc-chiesa/protokit/blob/main/CHANGELOG.md"
Issues = "https://github.com/marc-chiesa/protokit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/protokit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Register the `slow` marker so future --strict-markers adoption
# doesn't regress. Used by tests/schema/lint/test_perf_smoke.py to
# gate the perf-smoke test off the fast-iteration loop.
#
# Register the `parity` marker for the buf-parity test harness in
# tests/parity/. The marker is documentary — default `pytest tests/`
# still collects parity tests, but the `buf_binary` session fixture
# calls `pytest.skip(...)` when buf is absent, so they appear as
# graceful skips rather than failures. CI's dedicated `parity` job
# installs the pinned buf binary and runs these tests with the marker
# explicitly selected via `-m parity`.
markers = [
    "slow: tests excluded by `pytest -m 'not slow'` (currently: perf smoke on linux+py3.12)",
    "parity: buf-parity tests (tests/parity/); buf binary discovered via $BUF_BINARY or PATH (graceful skip if absent); CI runs them in the dedicated parity job",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Third-party libs without published type stubs. Both are tracked
# upstream (google.protobuf via types-protobuf which we deliberately
# DON'T pull in to avoid stub/runtime drift; protoxy 0.7+ ships no
# py.typed). Ignoring missing imports here keeps the strict-mode
# signal-to-noise ratio useful for the protokit code itself.
[[tool.mypy.overrides]]
# ptars ships py.typed (and its precise Literal signatures are useful — they
# catch e.g. a bad timestamp_unit). ignore_missing_imports covers the
# extra-absent env where `import ptars` (lazy, inside functions) is unresolvable.
module = ["google.protobuf.*", "protoxy", "ptars"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships py.typed but its stubs are incomplete (untyped ParquetWriter /
# write_batch / close trip --strict's disallow_untyped_calls). It is an optional
# ([parquet]) dependency; skip following its imports so its symbols type as Any
# rather than flooding strict mode with third-party no-untyped-call noise.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"

# `tomli` is a conditional dep (py<3.11 only); on py3.11+ environments
# it is NOT installed and mypy cannot find the import. The import is
# guarded by `if sys.version_info >= (3, 11): import tomllib else: import tomli`,
# so the runtime never hits an unsatisfiable import — but mypy still
# needs to be told to ignore the missing stub.
[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true
