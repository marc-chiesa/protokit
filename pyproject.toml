[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proto-differ"
version = "0.1.0"
description = "Python equivalent of Google's C++ MessageDifferencer for Protocol Buffers"
readme = {file = "README.adoc", content-type = "text/x-asciidoc"}
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Marc" },
]
keywords = ["protobuf", "diff", "grpc", "protocol-buffers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "protobuf>=4.21.0",
    "click>=8.0",
]

[project.scripts]
pbdiff = "proto_differ.cli:main"

[project.urls]
Repository = "https://github.com/marc/proto-differ"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_differ"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
