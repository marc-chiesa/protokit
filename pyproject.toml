[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protokit"
version = "0.1.0"
description = "Python toolkit for Protocol Buffers: structural message diffing and schema compatibility checking."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Marc" },
]
keywords = ["protobuf", "diff", "schema", "compatibility", "protocol-buffers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "protobuf>=4.21.0",
    "click>=8.0",
]

[project.optional-dependencies]
# In-process .proto → FileDescriptorSet compiler via Rust bindings.
# When installed, protokit's CLI prefers it over shelling out to
# protoc on PATH. Users who already have protoc installed don't need
# this extra; users who want a zero-external-dependency toolchain do.
compiler = [
    "protoxy>=0.7",
]
# Development / test-only dependencies.
#  - xmlschema validates JUnit XML output against the vendored
#    Apache Ant JUnit xsd in tests/fixtures/junit-xml/.
#  - jsonschema validates SARIF 2.1.0 output against the vendored
#    OASIS schema in tests/fixtures/sarif/.
# Neither is needed at runtime — formatters emit XML/JSON via
# stdlib only.
dev = [
    "pytest",
    "xmlschema>=2.0",
    "jsonschema>=4.0",
    "mypy>=1.8",
    "ruff>=0.5",
]

[project.scripts]
protokit = "protokit.cli:main"

[project.urls]
Repository = "https://github.com/marc/protokit"

[tool.hatch.build.targets.wheel]
packages = ["src/protokit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Third-party libs without published type stubs. Both are tracked
# upstream (google.protobuf via types-protobuf which we deliberately
# DON'T pull in to avoid stub/runtime drift; protoxy 0.7+ ships no
# py.typed). Ignoring missing imports here keeps the strict-mode
# signal-to-noise ratio useful for the protokit code itself.
[[tool.mypy.overrides]]
module = ["google.protobuf.*", "protoxy"]
ignore_missing_imports = true
